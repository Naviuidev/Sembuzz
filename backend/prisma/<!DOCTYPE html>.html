<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hero Overlap</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffdf8;
    }

    .hero {
      max-width: 1200px;
      margin: 50px auto;
      display: flex;
      gap: 20px;
      padding: 0 20px;
    }

    /* LEFT BIG IMAGE */
    .hero-left {
      flex: 2;
    }

    .hero-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    /* RIGHT SIDE */
    .hero-right {
      flex: 1;
      position: relative;
    }

    .top-img {
      width: 100%;
      border-radius: 20px;
      object-fit: cover;
      display: block;
    }

    .bottom-img {
      position: absolute;
      bottom: -60px;
      right: 5px;
      width: 75%;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
      }

      .hero-right {
        position: static;
        margin-top: 20px;
      }

      .bottom-img {
        position: static;
        width: 100%;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    
    <!-- LEFT BIG IMAGE -->
    <div class="hero-left">
      <img src="https://m.media-amazon.com/images/I/617kEPXM66L._SY879_.jpg" alt="Main Image">
    </div>

    <!-- RIGHT SIDE IMAGES -->
    <div class="hero-right">
      <img src="https://m.media-amazon.com/images/I/612vMmIH72L._SY879_.jpg" class="top-img" alt="Top Image">
      <img src="https://m.media-amazon.com/images/I/61qYVljs-fL._SY879_.jpg" class="bottom-img" alt="Bottom Image">
    </div>

  </div>

</body>
</html>
